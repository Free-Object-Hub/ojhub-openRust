[package]
name = "openRust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio"] }
base64 = "0.21"
p256 = { version = "0.13", features = ["pkcs8"] }
pkcs8 = { version = "0.10", features = ["pem"] }
web-push = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
